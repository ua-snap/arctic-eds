name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # Node 22 bundles npm 10, whose `npm ci` rejects the lockfile because a
      # transitive dependency (@bomb.sh/tab, via @nuxt/cli) declares optional
      # peer deps on versions of cac/commander that the tree does not carry.
      # npm 11+ validates optional peers correctly.
      - name: Update npm
        run: npm install -g npm@12
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: xvfb-run npx playwright test
        timeout-minutes: 15
        env:
          DEBUG: pw:webserver
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 10
